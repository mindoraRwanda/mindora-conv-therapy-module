version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: mindora_postgres
    restart: always
    ports:
      - "5100:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: mindora_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: mindora_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    environment:
      DATABASE_URL: postgres://postgres:12345@postgres:5432/postgres

  frontend:
    build: ./test-frontend
    container_name: mindora_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://backend:8000

volumes:
  postgres_data:
  qdrant_data:
