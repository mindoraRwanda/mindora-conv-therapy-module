services:
  backend:
    build: ./backend
    container_name: mindora-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mindora_db
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: mindora-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mindora_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
